<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>香港零售有限公司 | 公司資料</title>
<meta name="description" content="香港零售有限公司 — 公司資料頁面。"/>
<style>
:root{
  --bg:#06080c;
  --surface:#0c101a;
  --card:#121620;
  --border:#1e2230;
  --accent:#4080c0;
  --text:#e8ecf0;
  --muted:#808898;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:3rem;max-width:600px;width:100%;text-align:center;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);}
.icon{font-size:3rem;margin-bottom:1.5rem;}
.title{font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;}
.subtitle{font-size:0.85rem;color:var(--muted);margin-bottom:2rem;letter-spacing:0.06em;}
.info-block{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1.2rem;text-align:left;margin-bottom:1rem;}
.info-label{font-size:0.72rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:0.3rem;}
.info-val{font-size:0.9rem;}
.note{font-size:0.82rem;color:var(--muted);margin-top:1.5rem;line-height:1.6;}
footer{background:var(--surface);border-top:1px solid var(--border);padding:1rem 2rem;text-align:center;font-size:0.78rem;color:var(--muted);}
</style>
</head>
<body>
<div class="main">
  <div class="card">
    <div class="icon">🏢</div>
    <div class="title">香港公司</div>
    <div class="subtitle">Hong Kong · Retail Industry</div>
    <div class="info-block">
      <div class="info-label">地區 / Region</div>
      <div class="info-val">香港 Hong Kong SAR</div>
    </div>
    <div class="info-block">
      <div class="info-label">業務類別 / Industry</div>
      <div class="info-val">零售 Retail</div>
    </div>
    <div class="info-block">
      <div class="info-label">狀態 / Status</div>
      <div class="info-val">公司資料審查中 · Information Under Review</div>
    </div>
    <div class="note">此公司的詳細資料正在更新中。如有查詢，請直接聯絡相關機構。<br/>Company details are being updated. Please contact the relevant authority directly for enquiries.</div>
  </div>
</div>
<footer>© 2025 · 香港零售業 · Hong Kong Retail</footer>
</body>
</html>
